# Anwendungsname
spring.application.name=Max_Vorstellung_Backend

# H2-Datenbank Konfiguration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2-Konsole aktivieren
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL-Skripte bei Start ausführen
spring.sql.init.mode=always